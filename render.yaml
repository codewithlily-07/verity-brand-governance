services:
  - type: web
    name: verity-brand-governance
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "10"

