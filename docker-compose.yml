version: '3.8'

services:
  verity-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/verity
      - LLM_PROVIDER=gemini
      - LLM_MODEL=gemini-1.5-flash
      - LLM_API_KEY=${LLM_API_KEY:-}
      - DEMO_MODE=true
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=verity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
